name: Promemoria del mattino

# Il riepilogo parte da solo ogni mattina alle 7 dall'orologio interno di Supabase.
# Questo workflow serve solo per mandarlo subito a mano (per provare):
# Actions → Promemoria del mattino → Run workflow.
on:
  workflow_dispatch:

jobs:
  invia:
    runs-on: ubuntu-latest
    steps:
      - name: Manda adesso il riepilogo
        run: |
          curl --fail-with-body -sS -X POST \
            "https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/promemoria" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{}' | jq '{notifiche, whatsapp, errori: (.errori | length)}'
